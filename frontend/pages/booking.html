<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEXpress | 訂票</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.status-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: #fff; border-radius: 12px; padding: 10px 14px;
  margin-bottom: 12px; box-shadow: var(--shadow);
}
.status-ok { display: flex; align-items: center; gap: 7px; color: var(--green); font-size: 13px; font-weight: 600; }
.status-free { color: var(--text3); font-size: 13px; border-left: 1px solid var(--border); padding-left: 12px; cursor: pointer; }
.status-free:hover { color: var(--orange); }

.station-row {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
}
.station-box { flex: 1; }
.station-box.right { text-align: right; }
.station-label { font-size: 12px; color: var(--text3); margin-bottom: 2px; }
.station-name { font-size: 34px; font-weight: 800; color: var(--text); letter-spacing: -1px; cursor: pointer; }
.station-name:hover { color: var(--orange); }

.swap-btn {
  width: 52px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer; flex-direction: column; gap: 2px;
  padding: 8px; border-radius: 50%; transition: background 0.15s;
}
.swap-btn:hover { background: var(--gray-light); }
.swap-btn svg { width: 26px; height: 26px; stroke: var(--text2); fill: none; stroke-width: 2; }

.ticket-toggle {
  display: flex; background: var(--gray-light); border-radius: 10px; padding: 3px; margin-bottom: 16px;
}
.ticket-toggle button {
  flex: 1; border: none; background: transparent; padding: 9px;
  border-radius: 8px; font-size: 14px; color: var(--text3); cursor: pointer; font-family: inherit;
  transition: all 0.2s;
}
.ticket-toggle button.active {
  background: #fff; color: var(--orange); font-weight: 700;
  box-shadow: 0 1px 6px rgba(0,0,0,0.1);
}

.quick-loc {
  background: #fff; border-radius: 12px; padding: 13px 16px;
  margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
  color: var(--text3); font-size: 14px; box-shadow: var(--shadow); cursor: pointer;
  transition: all 0.15s;
}
.quick-loc:hover { color: var(--orange); }
.loc-pin { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }

.promo-card {
  background: linear-gradient(135deg, var(--orange) 0%, #ff9040 100%);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.promo-icon { font-size: 28px; }
.promo-text h4 { color: #fff; font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.promo-text p { color: rgba(255,255,255,0.8); font-size: 12px; }
.promo-arrow { color: rgba(255,255,255,0.7); font-size: 20px; margin-left: auto; }

/* Station picker modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 200; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.station-modal {
  background: #fff; width: 390px; border-radius: 24px 24px 0 0;
  padding: 0 0 40px; max-height: 70vh; overflow: hidden;
  display: flex; flex-direction: column;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 12px auto 0; }
.modal-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
.modal-search {
  width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
  font-size: 14px; font-family: inherit; outline: none; background: var(--gray-bg);
}
.modal-search:focus { border-color: var(--orange); background: #fff; }
.station-list { overflow-y: auto; flex: 1; }
.station-group-title { font-size: 12px; color: var(--text3); padding: 12px 20px 6px; font-weight: 600; }
.station-opt {
  display: flex; align-items: center; padding: 14px 20px; cursor: pointer;
  border-bottom: 1px solid var(--border); gap: 12px; transition: background 0.1s;
}
.station-opt:hover { background: var(--orange-light); }
.station-opt span { font-size: 16px; font-weight: 600; flex: 1; }
.station-opt small { color: var(--text3); font-size: 12px; }
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>

  <div class="topbar">
    <div class="topbar-main">
      <div class="brand"><span>T</span>EXpress</div>
      <div class="topbar-actions">
        <button title="客服">
          <svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 0 1 9 9v4a3 3 0 0 1-3 3h-1a3 3 0 0 1-3-3v-2a3 3 0 0 1 3-3 7 7 0 1 0-14 0 3 3 0 0 1 3 3v2a3 3 0 0 1-3 3H2a3 3 0 0 1-3-3v-4a9 9 0 0 1 9-9z"/></svg>
        </button>
        <button title="帳號">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </div>
    <nav class="top-tabs">
      <a class="active" href="booking.html">一般訂票</a>
      <a href="credit-card.html">信用卡優惠</a>
      <a href="free-seat.html">今日自由座</a>
    </nav>
  </div>

  <div class="page-content">
    <!-- Status -->
    <div class="status-bar">
      <div class="status-ok"><span class="dot-green"></span>全線正常營運</div>
      <div class="status-free" onclick="window.location='free-seat.html'">自由座等候時間 ›</div>
    </div>

    <!-- Main booking card -->
    <div class="card">
      <div class="station-row">
        <div class="station-box">
          <div class="station-label">出發站</div>
          <div class="station-name" id="dep-name" onclick="openStationModal('dep')">高雄</div>
        </div>
        <div class="swap-btn" onclick="swapStations()" title="交換">
          <svg viewBox="0 0 24 24"><path d="M7 16V4m0 0L3 8m4-4l4 4"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
        </div>
        <div class="station-box right">
          <div class="station-label">到達站</div>
          <div class="station-name" id="arr-name" onclick="openStationModal('arr')">台中</div>
        </div>
      </div>

      <div class="ticket-toggle">
        <button class="active" id="btn-single" onclick="setTicketType('single')">單程票</button>
        <button id="btn-round" onclick="setTicketType('round')">去回票</button>
      </div>

      <div class="field-row" onclick="openDatePicker()">
        <svg class="field-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <div class="field-body">
          <div class="field-label">去程時間</div>
          <div class="field-val" id="dep-date">2026/03/09（一）14:43</div>
        </div>
        <div class="field-chevron">›</div>
      </div>

      <div class="field-row" id="return-row" style="display:none" onclick="openDatePicker()">
        <svg class="field-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <div class="field-body">
          <div class="field-label">回程時間</div>
          <div class="field-val" id="ret-date">2026/03/10（二）18:00</div>
        </div>
        <div class="field-chevron">›</div>
      </div>

      <div class="field-row" onclick="openCarTypeModal()">
        <svg class="field-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2M8 14h.01M12 14h.01M16 14h.01"/></svg>
        <div class="field-body">
          <div class="field-label">車廂種類</div>
          <div class="field-val" id="car-type">標準車廂對號座</div>
        </div>
        <div class="field-chevron">›</div>
      </div>

      <div class="field-row" style="border-bottom:none" onclick="openPassengerModal()">
        <svg class="field-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <div class="field-body">
          <div class="field-label">乘客人數</div>
          <div class="field-val" id="passenger-val">全票 ×1</div>
        </div>
        <div class="field-chevron">›</div>
      </div>

      <a class="btn btn-primary" style="margin-top:18px;letter-spacing:3px;font-size:18px" href="train-list.html" id="search-btn">查 詢</a>
    </div>

    <!-- Quick location -->
    <div class="quick-loc" onclick="alert('常用行程功能')">
      <svg class="loc-pin" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      常用定位行程
    </div>

    <!-- Promo card -->
    <div class="promo-card" onclick="window.location='credit-card.html'">
      <div class="promo-icon">💳</div>
      <div class="promo-text">
        <h4>信用卡優惠回饋 9折起</h4>
        <p>綁定指定信用卡即享優惠</p>
      </div>
      <div class="promo-arrow">›</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="my-ticket.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2"/><line x1="8" y1="15" x2="8" y2="15" stroke-linecap="round" stroke-width="2"/><line x1="12" y1="15" x2="12" y2="15" stroke-linecap="round" stroke-width="2"/><line x1="16" y1="15" x2="16" y2="15" stroke-linecap="round" stroke-width="2"/></svg>
      我的車票
    </a>
    <a href="booking.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      訂票
    </a>
    <a href="payment.html" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="9" y2="15" stroke-linecap="round"/></svg>
      付款/取票
    </a>
    <a href="free-seat.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M21 10H7M21 6H3M21 14H3M21 18H7"/></svg>
      載入定位
    </a>
    <a href="other.html" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/><circle cx="5" cy="12" r="1" fill="currentColor"/></svg>
      其他
    </a>
  </nav>
</div>

<!-- Station Picker Modal -->
<div class="modal-overlay" id="station-modal">
  <div class="station-modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 id="modal-title">選擇出發站</h3>
      <input class="modal-search" type="text" placeholder="搜尋車站..." id="station-search" oninput="filterStations()">
    </div>
    <div class="station-list" id="station-list"></div>
  </div>
</div>

<script>
const STATIONS = [
  {name:'南港', en:'Nangang'}, {name:'台北', en:'Taipei'}, {name:'板橋', en:'Banqiao'},
  {name:'桃園', en:'Taoyuan'}, {name:'新竹', en:'Hsinchu'}, {name:'苗栗', en:'Miaoli'},
  {name:'台中', en:'Taichung'}, {name:'彰化', en:'Changhua'}, {name:'雲林', en:'Yunlin'},
  {name:'嘉義', en:'Chiayi'}, {name:'台南', en:'Tainan'}, {name:'左營', en:'Zuoying'},
  {name:'高雄', en:'Kaohsiung'}
];

let currentField = 'dep';
let depStation = '高雄', arrStation = '台中';

function openStationModal(field) {
  currentField = field;
  document.getElementById('modal-title').textContent = field === 'dep' ? '選擇出發站' : '選擇到達站';
  document.getElementById('station-search').value = '';
  renderStations(STATIONS);
  document.getElementById('station-modal').classList.add('open');
}

function renderStations(list) {
  const el = document.getElementById('station-list');
  el.innerHTML = '<div class="station-group-title">所有車站（由北至南）</div>' +
    list.map(s => `
      <div class="station-opt" onclick="selectStation('${s.name}')">
        <span>${s.name}</span>
        <small>${s.en}</small>
      </div>`).join('');
}

function filterStations() {
  const q = document.getElementById('station-search').value;
  renderStations(STATIONS.filter(s => s.name.includes(q) || s.en.toLowerCase().includes(q.toLowerCase())));
}

function selectStation(name) {
  if(currentField === 'dep') { depStation = name; document.getElementById('dep-name').textContent = name; }
  else { arrStation = name; document.getElementById('arr-name').textContent = name; }
  document.getElementById('station-modal').classList.remove('open');
}

function swapStations() {
  [depStation, arrStation] = [arrStation, depStation];
  document.getElementById('dep-name').textContent = depStation;
  document.getElementById('arr-name').textContent = arrStation;
}

document.getElementById('station-modal').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('open');
});

function setTicketType(t) {
  document.getElementById('btn-single').classList.toggle('active', t==='single');
  document.getElementById('btn-round').classList.toggle('active', t==='round');
  document.getElementById('return-row').style.display = t==='round' ? 'flex' : 'none';
}

function openDatePicker() { alert('日期選擇器（Demo：已設定 2026/03/09）'); }
function openCarTypeModal() { alert('車廂種類：標準車廂對號座'); }
function openPassengerModal() { alert('乘客人數設定（Demo：全票×1）'); }
</script>
</body>
</html>

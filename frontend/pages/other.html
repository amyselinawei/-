<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEXpress | 其他</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.user-card {
  background: var(--dark); border-radius: var(--radius); padding: 20px 18px;
  margin-bottom: 14px; display: flex; align-items: center; gap: 16px;
}
.avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--orange); display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 900; color: #fff; flex-shrink: 0;
}
.user-info h3 { color: #fff; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.user-info p { color: #888; font-size: 13px; }
.user-action { margin-left: auto; }
.user-action a { color: var(--orange); font-size: 13px; text-decoration: none; border: 1px solid rgba(255,107,0,0.4); padding: 6px 12px; border-radius: 8px; }

.menu-section { margin-bottom: 14px; }
.menu-label { font-size: 12px; color: var(--text3); font-weight: 600; padding: 0 4px 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.menu-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.menu-item {
  display: flex; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--border);
  text-decoration: none; cursor: pointer; transition: background 0.1s; gap: 14px;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:hover { background: var(--gray-bg); }
.mi-icon {
  width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.mi-icon svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; }
.mi-blue { background: #2196F3; }
.mi-green { background: #4CAF50; }
.mi-orange { background: var(--orange); }
.mi-purple { background: #9C27B0; }
.mi-teal { background: #009688; }
.mi-red { background: #F44336; }
.mi-gray { background: #607D8B; }
.mi-dark { background: var(--dark); }
.menu-item-body { flex: 1; }
.menu-item-body strong { display: block; font-size: 14px; color: var(--text); font-weight: 600; }
.menu-item-body small { font-size: 12px; color: var(--text3); }
.mi-chevron { color: #ccc; font-size: 18px; }
.mi-badge { background: var(--orange); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }

.version-note { text-align: center; color: #ccc; font-size: 12px; padding: 20px; }
</style>
</head>

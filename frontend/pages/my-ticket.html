<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEXpress | 我的車票</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.tab-switch { display: flex; background: #fff; border-radius: 12px; padding: 4px; margin-bottom: 14px; box-shadow: var(--shadow); }
.tab-switch a { flex: 1; text-align: center; padding: 9px; border-radius: 9px; font-size: 13px; color: var(--text3); text-decoration: none; transition: all 0.2s; }
.tab-switch a.active { background: var(--dark); color: #fff; font-weight: 600; }

.ticket-card {
  background: #fff; border-radius: 20px; overflow: hidden;
  box-shadow: 0 6px 24px rgba(0,0,0,0.1); margin-bottom: 12px;
}
.ticket-hd { background: var(--dark); padding: 18px 20px; }
.ticket-hd-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.ticket-badge-no { background: rgba(255,107,0,0.2); color: #FF8C33; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
.ticket-badge-ok { background: rgba(0,165,81,0.2); color: #00e070; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
.ticket-route { display: flex; align-items: center; }
.tkt-t { font-size: 30px; font-weight: 900; color: #fff; letter-spacing: -1px; }
.tkt-c { font-size: 12px; color: #888; margin-top: 2px; }
.tkt-mid { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0 8px; }
.tkt-line { width: 100%; height: 1.5px; background: rgba(255,107,0,0.4); position: relative; }
.tkt-line::after { content: '›'; position: absolute; right: -3px; top: -12px; color: var(--orange); font-size: 20px; }
.tkt-dur-text { font-size: 11px; color: #666; }
.tkt-right { text-align: right; }

.ticket-perf {
  background: #fff; display: flex; align-items: center; position: relative; overflow: visible;
}
.perf-hole { width: 24px; height: 24px; background: var(--gray-bg); border-radius: 50%; flex-shrink: 0; }
.perf-line { flex: 1; border-top: 2px dashed #e0e0e0; }

.ticket-body { padding: 16px 20px; }
.ticket-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
.tf span { font-size: 11px; color: var(--text3); display: block; margin-bottom: 3px; }
.tf strong { font-size: 14px; color: var(--text); font-weight: 700; }
.code-box { grid-column: 1/-1; background: #faf8f5; border-radius: 10px; padding: 12px 14px; border: 1px solid #ede9e0; }
.code-box span { font-size: 11px; color: var(--text3); margin-bottom: 4px; display: block; }
.code-box strong { font-size: 20px; letter-spacing: 3px; color: var(--text); font-weight: 900; }

.qr-section { padding: 0 20px 20px; display: flex; flex-direction: column; align-items: center; }
.qr-label-text { font-size: 12px; color: var(--text3); margin-bottom: 14px; }
.qr-wrap { width: 190px; height: 190px; background: #fff; border: 2px solid #111; border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
.qr-hint-text { font-size: 11px; color: #bbb; }

.action-btns { display: flex; gap: 8px; margin-bottom: 10px; }
.action-btns .btn { padding: 12px; font-size: 13px; }

.empty-state { text-align: center; padding: 50px 20px; }
.empty-state svg { width: 56px; height: 56px; stroke: #ddd; fill: none; margin: 0 auto 16px; display: block; }
.empty-state h3 { font-size: 16px; color: var(--text3); margin-bottom: 8px; }
.empty-state p { font-size: 13px; color: #bbb; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="topbar">
    <div class="topbar-main">
      <div class="brand"><span>T</span>EXpress</div>
      <div class="topbar-title">我的車票</div>
      <div class="topbar-actions" style="margin-left:auto">
        <button onclick="alert('歷史紀錄')">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="page-content">
    <div class="tab-switch">
      <a href="#" class="active" onclick="showTab('upcoming',this);return false">即將出發</a>
      <a href="#" onclick="showTab('past',this);return false">歷史車票</a>
      <a href="#" onclick="showTab('pending',this);return false">待付款</a>
    </div>

    <div id="tab-upcoming">
      <div class="ticket-card">
        <div class="ticket-hd">
          <div class="ticket-hd-row">
            <div class="ticket-badge-no">0834 次列車</div>
            <div class="ticket-badge-ok">✓ 已付款</div>
          </div>
          <div class="ticket-route">
            <div>
              <div class="tkt-t">14:43</div>
              <div class="tkt-c">高雄</div>
            </div>
            <div class="tkt-mid">
              <div class="tkt-line"></div>
              <div class="tkt-dur-text">49 min</div>
            </div>
            <div class="tkt-right">
              <div class="tkt-t">15:32</div>
              <div class="tkt-c">台中</div>
            </div>
          </div>
        </div>
        <div class="ticket-perf">
          <div class="perf-hole" style="margin-left:-12px"></div>
          <div class="perf-line"></div>
          <div class="perf-hole" style="margin-right:-12px"></div>
        </div>
        <div class="ticket-body">
          <div class="ticket-grid">
            <div class="tf"><span>車廂 / 座位</span><strong>6 車 / 2B</strong></div>
            <div class="tf"><span>票種</span><strong>全票</strong></div>
            <div class="tf"><span>乘客</span><strong>王小明</strong></div>
            <div class="tf"><span>日期</span><strong>2026/03/09</strong></div>
            <div class="tf code-box"><span>訂位代號</span><strong>THS928314</strong></div>
          </div>
        </div>
        <div class="ticket-perf">
          <div class="perf-hole" style="margin-left:-12px"></div>
          <div class="perf-line"></div>
          <div class="perf-hole" style="margin-right:-12px"></div>
        </div>
        <div class="qr-section">
          <div class="qr-label-text">出示 QR Code 進站</div>
          <div class="qr-wrap"><canvas id="qrCanvas" width="190" height="190"></canvas></div>
          <div class="qr-hint-text">THS928314</div>
        </div>
      </div>

      <div class="action-btns">
        <a class="btn btn-ghost" href="#">分享行程</a>
        <a class="btn btn-ghost" href="#">加入行事曆</a>
        <a class="btn btn-ghost" href="#" style="color:#E53935">退票</a>
      </div>
      <a class="btn btn-dark" href="booking.html">+ 再訂一張</a>
    </div>

    <div id="tab-past" style="display:none">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" stroke-width="1.5"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2"/></svg>
        <h3>暫無歷史車票</h3>
        <p>您的乘車紀錄將顯示於此</p>
        <a class="btn btn-primary" href="booking.html" style="display:inline-block;width:auto;padding:12px 24px">立即訂票</a>
      </div>
    </div>

    <div id="tab-pending" style="display:none">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <h3>無待付款訂單</h3>
        <p>已選定的車次尚未付款的訂單</p>
        <a class="btn btn-primary" href="booking.html" style="display:inline-block;width:auto;padding:12px 24px">立即訂票</a>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="my-ticket.html" class="nav-item active"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2"/></svg>我的車票</a>
    <a href="booking.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>訂票</a>
    <a href="payment.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>付款/取票</a>
    <a href="free-seat.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 10H7M21 6H3M21 14H3M21 18H7"/></svg>載入定位</a>
    <a href="other.html" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/><circle cx="5" cy="12" r="1" fill="currentColor"/></svg>其他</a>
  </nav>
</div>
<script>
function showTab(tab, el){
  ['upcoming','past','pending'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===tab?'block':'none';
  });
  document.querySelectorAll('.tab-switch a').forEach(a => a.classList.remove('active'));
  el.classList.add('active');
}

// Draw QR
const canvas = document.getElementById('qrCanvas');
if(canvas){
  const ctx = canvas.getContext('2d');
  const size = 190, cells = 21, cell = size/cells;
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,size,size);
  ctx.fillStyle = '#111';
  function seeded(seed){ let s=seed; return ()=>{ s=(s*1664525+1013904223)&0xffffffff; return (s>>>0)/0xffffffff; }; }
  const rand = seeded(928314);
  for(let r=0;r<cells;r++) for(let c=0;c<cells;c++){
    const inF = (r<8&&c<8)||(r<8&&c>cells-9)||(r>cells-9&&c<8);
    if(!inF && rand()>0.55) ctx.fillRect(c*cell,r*cell,cell-0.5,cell-0.5);
  }
  function finder(x,y){
    ctx.fillStyle='#111'; ctx.fillRect(x*cell,y*cell,7*cell,7*cell);
    ctx.fillStyle='#fff'; ctx.fillRect((x+1)*cell,(y+1)*cell,5*cell,5*cell);
    ctx.fillStyle='#111'; ctx.fillRect((x+2)*cell,(y+2)*cell,3*cell,3*cell);
  }
  finder(0,0); finder(cells-7,0); finder(0,cells-7);
}
</script>
</body>
</html>
